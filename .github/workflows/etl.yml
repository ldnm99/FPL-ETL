name: FPL ETL Pipeline (Medallion)

on:
  # Trigger on push to main
  push:
    branches:
      - main
  
  # Manual trigger from GitHub UI
  workflow_dispatch:
  
  # Scheduled runs (every gameweek - Saturdays at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 6'  # Every Saturday at 2 AM UTC
  
  # External API triggers
  repository_dispatch:
    types: [run_pipeline]

permissions:
  contents: read
    
jobs:
  etl_job:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID || '38279' }}
      SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET || 'data' }}
      SEASON_PREFIX: ${{ secrets.SEASON_PREFIX || '2025_2026' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock --no-deps
          else
            echo "⚠️ requirements.lock not found — falling back to requirements.txt (non-reproducible)"
            pip install -r requirements.txt
          fi

      - name: Run Medallion ETL Pipeline
        run: |
          python -m src.main_medallion
      
      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: etl-logs
          path: logs/*.log
          retention-days: 7
