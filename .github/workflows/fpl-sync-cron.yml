name: FPL Zero-Cost Adaptive Sync Cron

on:
  workflow_dispatch:
  # Deprecated in favor of unified schedule in fpl-matchday-sync.yml to avoid duplicate runs
  # schedule:
  #   - cron: '*/15 11-21 * * 6'
  #   - cron: '*/15 12-20 * * 0'
  #   - cron: '*/15 18-22 * * 2,3,4'
  #   - cron: '*/15 19-22 * * 1,5'
  #   - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  sync_live_fpl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
      FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID || '38279' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Fast Adaptive Live Sync
        run: |
          python src/etl/sync_fpl_draft_to_supabase.py
